name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        shell: bash
        run: |
          candleaudit candles examples/candles_clean.csv --interval 4h
          candleaudit features examples/features_clean.csv
          candleaudit trades examples/trades_clean.csv --candles examples/candles_clean.csv
          if candleaudit candles examples/candles_bad.csv --interval 4h; then exit 1; fi
          if candleaudit features examples/features_bad.csv; then exit 1; fi
